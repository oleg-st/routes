<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fellowship route planner</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="topbar">
  <a class="brand" href="index.html" aria-label="Fellowship Route Planner"><span class="brand-icon">◈</span><span>FELLOWSHIP<small>ROUTE PLANNER</small></span></a>
  <div class="dungeon-picker"><label for="dungeon">DUNGEON</label><select id="dungeon" aria-label="Dungeon"></select></div>
  <div class="difficulty-picker"><label for="difficulty">DIFFICULTY</label><select id="difficulty" aria-label="Difficulty"></select></div>
  <ul id="room-avatars" aria-label="Room participants" hidden></ul>
  <div class="header-actions"><button id="together" title="Route Together">Route Together</button><button id="import-log-button" title="Import a Fellowship Logs report">Import from log</button><button id="import" aria-label="Import" title="Import a route string">↓ <span>Import</span></button><button id="export" aria-label="Export" title="Copy route to clipboard">↑ <span>Export</span></button><button id="share" aria-label="Share" title="Copy route link">↗ <span>Share</span></button><button id="library" title="Saved routes">▤ <span>Routes</span></button><button id="help" class="square" aria-label="Help">?</button></div>
</header>
<section id="room-bar" aria-label="Route Together session" hidden><strong id="room-code-display"></strong><span id="room-status" role="status"></span><button id="room-copy-code">Copy code</button><button id="room-copy-link">Copy link</button><details id="room-sessions"><summary id="room-session-count">Sessions</summary><ul id="room-session-list"></ul><small id="room-leader-status"></small></details><button id="room-reconnect">Reconnect</button><button id="room-profile">Profile</button><button id="room-settings">Network</button><button id="room-leave">Leave room</button><p id="room-diagnostic" role="alert" hidden></p></section>
<section id="room-waiting" hidden><h1 id="room-waiting-title">Waiting for route</h1><p id="room-waiting-text"></p></section>
<main id="workspace">
  <section class="map-section" aria-label="Dungeon map">
    <section id="log-review" class="log-review" aria-label="Import from log" hidden></section>
    <div id="floor-panel" class="map-toolbar" hidden><div class="toolbar-group"><div id="floors" class="floor-tabs"></div></div></div>
    <div id="map-stage" class="map-stage">
      <button id="layers" class="display-options-button" title="Display options" aria-label="Display options" aria-expanded="false" aria-controls="layers-panel">☷</button>
      <svg id="map" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-label="Interactive map" tabindex="0"><defs><clipPath id="mob-portrait-clip" clipPathUnits="objectBoundingBox"><circle cx=".5" cy=".5" r=".5"/></clipPath><marker id="arrowhead" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs><image id="map-image"/><g id="pull-outlines"></g><g id="patrols"></g><g id="campfires"></g><g id="markers"></g><g id="pack-labels"></g><g id="pack-efficiency" pointer-events="none"></g><g id="pack-health" pointer-events="none"></g><g id="draft"></g><g id="pull-labels" pointer-events="none"></g><g id="status-badges"></g><g id="drawings"></g><g id="map-start" pointer-events="none"></g></svg>
      <div id="map-loading">Loading game data…</div>
      <div class="map-controls">
        <div class="drawing-toolbar" aria-label="Map tools"><button data-tool="select" class="active" title="Select packs · V" aria-label="Select packs"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" fill-opacity=".2" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M5 3v16l4-4 3 6 3-1.5-3-6H20Z"/></svg></button><button data-tool="box" title="Box select whole packs · B" aria-label="Box select whole packs"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx=".5" stroke-dasharray="1 3" stroke-linecap="round"/></svg></button><button data-tool="split" title="Split pull: drag a line or click two points · S" aria-label="Split pull"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 5h16v14H4z" fill="currentColor" fill-opacity=".18" stroke="currentColor" stroke-width="1.5"/><path d="M9 2l6 20" fill="none" stroke="currentColor" stroke-width="2"/></svg></button><span></span><div class="arrow-tool"><button data-tool="line" title="Draw arrow · Color and thickness · D" aria-label="Draw arrow and settings" aria-expanded="false" aria-controls="arrow-options"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19 19 5M9 5h10v10"/></svg></button><div id="arrow-options" hidden><strong>COLOR</strong><div class="arrow-colors" role="group" aria-label="Arrow color"></div><strong>THICKNESS</strong><div class="arrow-widths" role="group" aria-label="Arrow thickness"></div></div></div><button data-tool="portal" title="Portal: two points" aria-label="Portal"><img src="images/hero-items/relic-b-crit-portal-hero-item-200.avif" alt="" width="26" height="26" draggable="false"></button><button data-tool="invis" title="Invisibility: two points" aria-label="Invisibility"><img src="images/hero-items/relic-b-expertise-groupinvisibility-hero-item-200.avif" alt="" width="26" height="26" draggable="false"></button><button data-tool="marker" title="Add marker / note" aria-label="Add marker / note"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 1 1 16 0Z"/><path d="M9 10h6M12 7v6"/></svg></button></div>
        <div id="route-relics" class="route-relics" aria-label="Route relics" aria-live="polite"></div>
        <div class="modifiers" aria-label="Dungeon modifiers">
        <button id="shadow" aria-label="Shadow Lord" title="Shadow Lord" aria-pressed="false"><img src="images/modifiers/shadow-lord.avif" alt=""></button>
        <button id="empowered" aria-label="Empowered" title="Empowered" aria-pressed="false"><img src="images/modifiers/empowered-minions.avif" alt=""></button>
        <button id="ghorn" aria-label="Ghorn" title="Ghorn" aria-pressed="false"><img src="images/modifiers/winter-giant.avif" alt=""></button>
        <button id="witch" aria-label="Witch" title="Witch" aria-pressed="false"><img src="images/modifiers/winter-witch.avif" alt=""></button>
        </div>
      </div>
      <div id="layers-panel" class="popover" hidden><strong>Display options</strong><label id="floor-panel-option"><input id="show-floor-panel" type="checkbox"> Map layer panel</label><label><input id="show-packs" type="checkbox"> Pack numbers and percentages</label><label><input id="show-hp" type="checkbox"> Show HP</label><label title="Kill score % / dungeon HP %. Colors compare all non-boss packs in this dungeon; green is more efficient."><input id="show-pack-efficiency" type="checkbox"> Pack efficiency</label><label><input id="show-mob-icons" type="checkbox" checked> Enemy portraits</label><label><input id="show-patrols" type="checkbox" checked> Patrol paths</label><label><input id="hide-unselected" type="checkbox"> Only route enemies</label><label class="marker-size">Marker size<input id="marker-size" type="range" min="4" max="12" value="6" aria-label="Marker size"></label></div>
      <div class="map-search"><span>⌕</span><input id="search" placeholder="Find an enemy or G12…" aria-label="Search enemies or packs"><button id="clear-search" aria-label="Clear search">×</button></div>
      <div id="search-results" class="search-results" hidden></div>
      <div id="tooltip" class="tooltip" hidden></div>
      <div id="enemy-menu" class="enemy-menu" role="menu" aria-label="Enemy actions" hidden></div>
      <aside id="inspector" class="inspector" hidden></aside>
    </div>
  </section>
  <aside class="sidebar" aria-label="Route pulls">
    <button id="storage-status" class="text-button" role="status" aria-live="polite">Opening storage…</button>
    <input id="route-name" class="route-name" aria-label="Route name" maxlength="200" value="Route 1">
    <section class="progress-card"><div class="progress-heading"><span>Route progress</span><strong id="total-percent">0.00<span>%</span></strong></div><div class="progress-track"><div id="progress-fill"></div></div><div class="score-row"><span id="total-score">0 / 0 points</span><span id="score-remaining"></span></div><div id="route-health" aria-live="polite"></div></section>
    <div class="pull-list-heading"><span class="eyebrow">PULLS <span id="pull-count">1</span></span><div><button id="add-pull" class="add-pull" title="Add pull · N">＋ Pull</button><button id="undo" class="square" title="Undo · Ctrl+Z" aria-label="Undo">↶</button><button id="redo" class="square" title="Redo · Ctrl+Y" aria-label="Redo">↷</button></div></div>
    <div id="pulls" class="pulls"></div>
    <div class="sidebar-bottom"><button id="new-route" aria-label="Add new route" title="Add new route">+ New</button><button id="clear-route" aria-label="Clear route" title="Clear all pulls and map objects · can be undone">Clear</button><button id="delete-route" hidden aria-label="Delete route" title="Delete from saved routes"><svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M6 1h4v2h4v2H2V3h4V1Zm1 1v1h2V2H7ZM3 6h10v9H3V6Zm2 1v6h2V7H5Zm4 0v6h2V7H9Z"/></svg></button><button id="save-route" class="primary" aria-label="Save route">Save</button></div>
  </aside>
  <div id="pull-tooltip" class="tooltip pull-tooltip" role="dialog" aria-label="Pull composition" hidden></div>
  <div id="chicken-tooltip" class="tooltip chicken-tooltip" role="dialog" aria-label="Chicken mobs" hidden></div>
</main>
<dialog id="dialog"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="close-dialog" class="square" aria-label="Close">×</button></div><div id="dialog-content"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body></html>
